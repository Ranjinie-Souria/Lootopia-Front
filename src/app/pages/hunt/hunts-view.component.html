<div class="container-hunt">
  <h1>My Hunts</h1>

  <div class="btn-container-hunt">
    <button (click)="goToCreateHunt()">Create a Hunt</button>
  </div>

  <div *ngIf="loading" class="card-container-hunt">
    <p>Loading hunts...</p>
  </div>

  <div *ngIf="error" class="error">
    <p>{{ error }}</p>
  </div>

  @if(hunts && hunts.content && hunts.content.length > 0) {
    <div class="card-container-hunt">
      <div *ngFor="let hunt of hunts.content" class="card-hunt">
        <h2>{{ hunt.title }}</h2>
        <p class="description">{{ hunt.description }}</p>
        <button (click)="goToHuntDetails(hunt.id)">View Details</button>
      </div>
    </div>
  }
  <div *ngIf="!loading && hunts.content.length === 0" class="card-container-hunt">
    <p>No hunts found. Create your first hunt above!</p>
  </div>

</div>
