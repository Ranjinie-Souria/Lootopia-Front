<div class="container">
  <h1>My Hunts</h1>

  <div class="btn-container">
    <button (click)="goToCreateHunt()">Create a Hunt</button>
  </div>

  <div *ngIf="loading" class="card-container">
    <p>Loading hunts...</p>
  </div>

  <div *ngIf="error" class="error">
    <p>{{ error }}</p>
  </div>

  <div *ngIf="!loading && hunts.content.length === 0" class="card-container">
    <p>No hunts found. Create your first hunt above!</p>
  </div>

</div>
